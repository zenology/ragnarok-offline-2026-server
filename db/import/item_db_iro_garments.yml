- Id: 20752
  AegisName: IRO_History_Garment_20752
  Name: Golden Wing
  Type: Armor
  Weight: 10
  Defense: 15
  Slots: 1
  Locations:
    Garment: true
  ArmorLevel: 1
  EquipLevelMin: 1
  Refineable: true
  Script: |
    .@r = getequiprefinerycnt(EQI_GARMENT);
    bonus bExpAddRace,RC_All,10;
    bonus bDropAddRace,RC_All,10;
    if (readparam(bStr) >= 90) {
      bonus bAllStats,1;
      bonus bMaxHPrate,1;
      bonus bMaxSPrate,1;
      bonus bStr,.@r;
    }
    if (readparam(bAgi) >= 90) {
      bonus bAllStats,1;
      bonus bMaxHPrate,1;
      bonus bMaxSPrate,1;
      bonus bAgi,.@r;
    }
    if (readparam(bVit) >= 90) {
      bonus bAllStats,1;
      bonus bMaxHPrate,1;
      bonus bMaxSPrate,1;
      bonus bVit,.@r;
    }
    if (readparam(bInt) >= 90) {
      bonus bAllStats,1;
      bonus bMaxHPrate,1;
      bonus bMaxSPrate,1;
      bonus bInt,.@r;
    }
    if (readparam(bDex) >= 90) {
      bonus bAllStats,1;
      bonus bMaxHPrate,1;
      bonus bMaxSPrate,1;
      bonus bDex,.@r;
    }
    if (readparam(bLuk) >= 90) {
      bonus bAllStats,1;
      bonus bMaxHPrate,1;
      bonus bMaxSPrate,1;
      bonus bLuk,.@r;
    }
