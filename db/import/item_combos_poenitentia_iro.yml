# Divine Pride iRO / English alignment, 2026-10-28.
# Existing pair keys replace scripts; Clear removes only the approved extra set.
Header:
  Type: COMBO_DB
  Version: 1

Body:
  - Combos:
      - Combo: [Poenetentia_B_Crown, Poenitentia_Catapulta]
    Script: |
      .@r = getequiprefinerycnt(EQI_HAND_R);
      bonus bShortAtkRate,15;
      bonus2 bSkillAtk,"RK_HUNDREDSPEAR",10*(.@r/2);
      bonus2 bSkillAtk,"DK_MADNESS_CRUSHER",10*(.@r/2);
  # Visible Planta is 550060 / Poenitentia_Ramus; Ramus is 550061 / Poenitentia_Planta.
  - Combos:
      - Combo: [Poenetentia_S_Crown, Poenitentia_Ramus]
    Script: |
      bonus bSMatk,10;
      bonus2 bSkillAtk,"SU_CN_METEOR",12*(getequiprefinerycnt(EQI_HAND_R)/2);
      bonus2 bSkillAtk,"SH_HYUN_ROKS_BREEZE",8*(getequiprefinerycnt(EQI_HAND_R)/2);
  - Combos:
      - Combo: [Poenetentia_S_Crown, Poenitentia_Planta]
    Script: |
      bonus bSMatk,10;
      bonus2 bSkillAtk,"SOA_EXORCISM_OF_MALICIOUS_SOUL",8*(getequiprefinerycnt(EQI_HAND_R)/2);
      bonus2 bSkillAtk,"SOA_TALISMAN_OF_WHITE_TIGER",8*(getequiprefinerycnt(EQI_HAND_R)/2);
  - Combos:
      - Combo: [Poenitentia_Follower_US, Poenetentia_Dilacero]
      - Combo: [Poenitentia_Follower_US, Poenetentia_Attendo]
      - Combo: [Poenitentia_Follower_US, Poenetentia_Vatia]
    Script: |
      bonus bAllStats,15;
      bonus bAllTraitStats,15;
      bonus2 bAddSize,Size_All,10*getequiprefinerycnt(EQI_HAND_R);
      bonus2 bMagicAddSize,Size_All,10*getequiprefinerycnt(EQI_HAND_R);
  # Player-approved removal: neither iRO weapon description grants this extra set.
  - Combos:
      - Combo: [Poenitentia_Sol, Poenitentia_Jana]
    Clear: true
  - Combos:
      - Combo: [IRO_History_Accessory_490742, Poenitentia_Ramus]
