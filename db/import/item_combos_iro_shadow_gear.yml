    Script: |
      bonus bPAtk,5;
      bonus bSMatk,5;
      bonus2 bIgnoreResRaceRate,RC_All,30;
      bonus2 bIgnoreResRaceRate,RC_Player_Human,-30;
      bonus2 bIgnoreResRaceRate,RC_Player_Doram,-30;
      bonus2 bIgnoreMResRaceRate,RC_All,30;
      bonus2 bIgnoreMResRaceRate,RC_Player_Human,-30;
      bonus2 bIgnoreMResRaceRate,RC_Player_Doram,-30;
  - Combos:
      - Combo: [21Anni3_W_Shadow_TW, Clear_Shield_Shadow3_TW]
    Script: |
      bonus bPAtk,15;
      bonus bSMatk,15;
      bonus2 bIgnoreResRaceRate,RC_All,50;
      bonus2 bIgnoreResRaceRate,RC_Player_Human,-50;
      bonus2 bIgnoreResRaceRate,RC_Player_Doram,-50;
      bonus2 bIgnoreMResRaceRate,RC_All,50;
      bonus2 bIgnoreMResRaceRate,RC_Player_Human,-50;
      bonus2 bIgnoreMResRaceRate,RC_Player_Doram,-50;
  - Combos:
      - Combo: [Limit_Break_SH_E, Limit_Break_SH_P]
    Script: |
      bonus bAllStats,12;
      bonus2 bAddRace,RC_All,8;
      bonus2 bMagicAddRace,RC_All,8;
  - Combos:
      - Combo: [S_Double_Weapon_P_TW, S_Double_Shield_P_TW]
    Script: |
      bonus bPow,5;
      bonus bSta,5;
      if (getequiprefinerycnt(EQI_SHADOW_WEAPON)+getequiprefinerycnt(EQI_SHADOW_SHIELD)>=20) {
         bonus2 bAddEle,Ele_All,8;
         bonus2 bDropAddRace,RC_All,3;
      }
  - Combos:
      - Combo: [S_Double_Weapon_M_TW, S_Double_Shield_M_TW]
    Script: |
      bonus bSpl,5;
      bonus bWis,5;
      if (getequiprefinerycnt(EQI_SHADOW_WEAPON)+getequiprefinerycnt(EQI_SHADOW_SHIELD)>=20) {
         bonus2 bMagicAddEle,Ele_All,8;
         bonus2 bDropAddRace,RC_All,3;
      }
  - Combos:
      - Combo: [S_Spell_M_Earring_US, S_Spell_M_Pendant]
    Script: |
      .@sum = getequiprefinerycnt(EQI_SHADOW_ACC_R)+getequiprefinerycnt(EQI_SHADOW_ACC_L);
      bonus bSMatk,2;
      if (.@sum>=15) {
         bonus bMaxSPrate,3;
         bonus2 bMagicAddEle,Ele_All,5;
      }
      if (.@sum>=18) {
         bonus2 bIgnoreMdefRaceRate,RC_All,50;
         bonus2 bIgnoreMdefRaceRate,RC_Player_Human,-50;
         bonus2 bIgnoreMdefRaceRate,RC_Player_Doram,-50;
      }
  - Combos:
      - Combo: [S_Spell_M_Earring_US, S_Spell_M_Pendant, S_Master_Weapon]
    Script: |
      .@sum = getequiprefinerycnt(EQI_SHADOW_ACC_R)+getequiprefinerycnt(EQI_SHADOW_ACC_L)+getequiprefinerycnt(EQI_SHADOW_WEAPON);
      bonus2 bMagicAddSize,Size_All,5;
      bonus bSMatk,2;
      if (.@sum>=27) {
         bonus2 bIgnoreMResRaceRate,RC_All,10;
         bonus2 bIgnoreMResRaceRate,RC_Player_Human,-10;
         bonus2 bIgnoreMResRaceRate,RC_Player_Doram,-10;
      }
