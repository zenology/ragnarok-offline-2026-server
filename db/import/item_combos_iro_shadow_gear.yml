  # These two special DEF/MDEF bonuses include players; RES/MRES do not.
  - Combos:
      - Combo: [21Anni2_W_Shadow_TW, Clear_Shield_Shadow1_TW]
      - Combo: [21Anni2_W_Shadow_TW, Clear_Shield_Shadow2_TW]
    Script: |
      bonus bPAtk,3;
      bonus bSMatk,3;
      bonus2 bIgnoreDefRaceRate,RC_All,50;
      bonus2 bIgnoreMdefRaceRate,RC_All,50;
      bonus2 bIgnoreResRaceRate,RC_All,12;
      bonus2 bIgnoreResRaceRate,RC_Player_Human,-12;
      bonus2 bIgnoreResRaceRate,RC_Player_Doram,-12;
      bonus2 bIgnoreMResRaceRate,RC_All,12;
      bonus2 bIgnoreMResRaceRate,RC_Player_Human,-12;
      bonus2 bIgnoreMResRaceRate,RC_Player_Doram,-12;
