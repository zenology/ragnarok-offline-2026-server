  - Id: 450516
    AegisName: IRO_Review_Armor_450516
    Name: Thorn Armor
    Type: Armor
    Weight: 1500
    Defense: 200
    Slots: 1
    Locations:
      Armor: true
    ArmorLevel: 2
    EquipLevelMin: 1
    Refineable: true
    Gradable: true
    Script: |
      .@r = getrefine();
      .@g = getenchantgrade();
      bonus bDefEle,Ele_Earth;
      bonus bShortWeaponDamageReturn,30;
      bonus bLongWeaponDamageReturn,30;
      bonus bPAtk,7*.@r;
      bonus bPow,.@r/2;
      bonus bCon,.@r/2;
      bonus2 bAddEle,Ele_All,7*(.@r/2);
      bonus bBaseAtk,70*(.@r/3);
      if (.@r>=10) {
         bonus bPow,5;
         bonus bCon,5;
         bonus bFlee2,20;
      }
      if (.@r>=11) {
         bonus2 bSkillAtk,"BO_MAYHEMIC_THORNS",20;
         bonus2 bSkillAtk,"TR_ROSEBLOSSOM",30;
      }
      if (.@r>=12) bonus2 bAddEle,Ele_All,15;
      if (.@r>=13) {
         skill "SO_STRIKING",5;
         autobonus3 "{ bonus2 bAddEle,Ele_All,30; }",1000,20000,"SO_STRIKING";
      }
      if (.@r>=14) {
         bonus bLongAtkRate,25;
         bonus2 bSkillCooldown,"TR_ROSEBLOSSOM",-400;
         bonus2 bSkillCooldown,"BO_MAYHEMIC_THORNS",-400;
      }
      if (.@g>=ENCHANTGRADE_D) {
         bonus bMaxHPrate,15;
         bonus bMaxSPrate,15;
      }
      if (.@g>=ENCHANTGRADE_C) bonus bVariableCastrate,-15;
      if (.@g>=ENCHANTGRADE_B) bonus bDelayrate,-20;
      if (.@g>=ENCHANTGRADE_A) {
         bonus2 bSkillAtk,"BO_MAYHEMIC_THORNS",50;
         bonus2 bSkillAtk,"TR_ROSEBLOSSOM",50;
      }
